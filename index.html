    <meta charset="UTF-8" />

    <link

    <link rel="stylesheet" href="./css/style.css" />

  </head>
  <body>

    <div data-include="/sections/header.html"></div>
    <main>
      <div data-include="/sections/MV.html"></div>
      <div data-include="/sections/marquee.html"></div>
      <div data-include="/sections/about.html"></div>
    </main>
    <script src="https://unpkg.com/lenis@1.3.26/dist/lenis.min.js"></script>

    <script>
      new Lenis({
        autoRaf: true,
        autoToggle: true,
        anchors: true,
        allowNestedScroll: true,
        naiveDimensions: true,
        stopInertiaOnNavigate: true,
      });
    </script>

    <script>
      document.querySelectorAll(".marquee").forEach((marquee) => {
        const track = marquee.querySelector(".marquee__track");
        const original = track.querySelector(".marquee__group");

        // Clone the original group
        const clone = original.cloneNode(true);
        clone.setAttribute("aria-hidden", "true");
        track.appendChild(clone);

        let position = 0;
        let lastTime = performance.now();

        const speed = Number(marquee.dataset.speed) || 1;

        function animate(currentTime) {
          const delta = currentTime - lastTime;
          lastTime = currentTime;

          position -= speed * (delta / 16.67);

          const groupWidth = original.offsetWidth;

          // Reset exactly when the first group has completely moved away
          if (Math.abs(position) >= groupWidth) {
            position += groupWidth;
          }

          track.style.transform = `translate3d(${position}px, 0, 0)`;

          requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);
      });
    </script>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        gsap.defaults({
          ease: "sine.inOut",
        });
        /*
         * Organic movement:
         * The background shapes slowly morph by changing position,
         * rotation and scale. Different durations prevent the motion
         * from looking synchronized.
         */
        gsap.to(".blob--blue", {
          x: 35,
          y: 22,
          rotation: 7,
          scale: 1.08,
          duration: 7,
          repeat: -1,
          yoyo: true,
        });

        gsap.to(".blob--pink", {
          x: -35,
          y: -25,
          rotation: -8,
          scale: 1.1,
          duration: 8.5,
          repeat: -1,
          yoyo: true,
        });

        gsap.to(".blob--bottom-left", {
          x: 30,
          y: -20,
          scale: 1.12,
          duration: 6,
          repeat: -1,
          yoyo: true,
        });

        /*
         * Floating orbs.
         */
        gsap.to(".orb-1", {
          x: 22,
          y: 30,
          scale: 1.12,
          duration: 4.5,
          repeat: -1,
          yoyo: true,
        });

        gsap.to(".orb-2", {
          x: -18,
          y: 20,
          scale: 0.85,
          duration: 3.2,
          repeat: -1,
          yoyo: true,
        });

        gsap.to(".orb-3", {
          x: -28,
          y: 22,
          scale: 1.08,
          duration: 6,
          repeat: -1,
          yoyo: true,
        });

        gsap.to(".orb-4", {
          x: 20,
          y: -18,
          scale: 1.15,
          duration: 3.8,
          repeat: -1,
          yoyo: true,
        });

        gsap.to(".orb-5", {
          x: 25,
          y: -25,
          scale: 0.9,
          duration: 4.2,
          repeat: -1,
          yoyo: true,
        });

        gsap.to(".orb-6", {
          x: -18,
          y: 25,
          scale: 1.2,
          duration: 3.6,
          repeat: -1,
          yoyo: true,
        });

        /*
         * Dots gently drift and pulse.
         */
        gsap.utils.toArray(".dots").forEach((dots, index) => {
          gsap.to(dots, {
            x: index % 2 ? -8 : 8,
            y: index % 2 ? 7 : -7,
            opacity: 0.35,
            duration: 2.8 + index * 0.35,
            repeat: -1,
            yoyo: true,
          });
        });

        /*
         * Flowing SVG lines subtly move.
         */
        gsap.to(".line--top", {
          x: 12,
          y: 8,
          rotation: 2,
          duration: 5,
          repeat: -1,
          yoyo: true,
        });

        gsap.to(".line--bottom", {
          x: -15,
          y: -8,
          rotation: -2,
          duration: 6,
          repeat: -1,
          yoyo: true,
        });

        gsap.to(".line--pink", {
          x: -10,
          y: -6,
          duration: 4.5,
          repeat: -1,
          yoyo: true,
        });

        /*
         * Very subtle center breathing effect.
         */
        gsap.to(".glow", {
          scale: 1.15,
          opacity: 0.75,
          duration: 5,
          repeat: -1,
          yoyo: true,
        });
      });
    </script>

    <!-- <script src="./js/sap.js"></script> -->
    <script src="./js/lang.js"></script>
    <script src="./js/include.js"></script>
  </body>
</html>
